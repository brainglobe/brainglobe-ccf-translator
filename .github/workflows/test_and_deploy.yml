name: tests

on:
  push:
    branches:
      - "main"
    tags:
      - "v**"
  pull_request:
  workflow_dispatch:

jobs:
  linting:
    runs-on: ubuntu-latest
    steps:
      - uses: neuroinformatics-unit/actions/lint@34bedfdfd70c6010be02182c9ca37fae8a1fd99d # v3.0.0

  manifest:
    runs-on: ubuntu-latest
    steps:
      - uses: neuroinformatics-unit/actions/check_manifest@34bedfdfd70c6010be02182c9ca37fae8a1fd99d # v3.0.0

  test:
    needs: [linting, manifest]
    name: ${{ matrix.os }} py${{ matrix.python-version }}
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest]
        python-version: ["3.12", "3.13", "3.14"]
        include:
          # Intel standard runners have 14 GB RAM; macos-latest has 7 GB.
          - os: macos-15-intel
            python-version: "3.14"
          - os: windows-latest
            python-version: "3.14"

    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}

      - name: Configure deformation download directory
        shell: bash
        run: |
          python - <<'PY'
          import configparser
          from pathlib import Path

          # Keep downloads outside the checkout: the shared test action
          # checks out and cleans the workspace again before running tests.
          downloads = Path("../ccf-ci-downloads").resolve()
          downloads.mkdir(parents=True, exist_ok=True)
          config = configparser.ConfigParser()
          config["default_dirs"] = {
              "brainglobe_dir": str(downloads),
              "interm_download_dir": str(downloads),
          }
          path = Path.home() / ".config/brainglobe/bg_config.conf"
          path.parent.mkdir(parents=True, exist_ok=True)
          with path.open("w") as output:
              config.write(output)
          PY

      # The full test data is 22 GiB. Cache the P5 route's 8.4 GiB within
      # the default 10 GB allowance, sharing one archive across the matrix.
      - name: Cache P5 deformation downloads
        uses: actions/cache@v6
        with:
          enableCrossOsArchive: true
          key: ccf-p5-deformation-fields-v1-${{ hashFiles('brainglobe_ccf_translator/metadata/translation_metadata.csv') }}
          path: |
            ../ccf-ci-downloads/deformation_fields/demba_dev_mouse/28_pull_29_v1.1.nii.gz
            ../ccf-ci-downloads/deformation_fields/demba_dev_mouse/21_pull_22_v1.1.nii.gz
            ../ccf-ci-downloads/deformation_fields/demba_dev_mouse/14_pull_15_v1.1.nii.gz
            ../ccf-ci-downloads/deformation_fields/demba_dev_mouse/7_pull_8_v1.1.nii.gz
            ../ccf-ci-downloads/deformation_fields/demba_dev_mouse/5_pull_4_v1.1.nii.gz

      - name: Run tests
        uses: neuroinformatics-unit/actions/test-uv@34bedfdfd70c6010be02182c9ca37fae8a1fd99d # v3.0.0
        with:
          python-version: "${{ matrix.python-version }}"
          secret-codecov-token: ${{ secrets.CODECOV_TOKEN }}

  build_sdist_wheels:
    name: Build source distribution and wheel
    needs: [test]
    if: github.event_name == 'push' && github.ref_type == 'tag'
    runs-on: ubuntu-latest
    steps:
      - uses: neuroinformatics-unit/actions/build_sdist_wheels@34bedfdfd70c6010be02182c9ca37fae8a1fd99d # v3.0.0

  upload_all:
    name: Publish build distributions
    needs: [build_sdist_wheels]
    if: github.event_name == 'push' && github.ref_type == 'tag'
    runs-on: ubuntu-latest
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: artifact
          path: dist
      - uses: pypa/gh-action-pypi-publish@release/v1
